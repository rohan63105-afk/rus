<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2347">
<title>RuStar অ্যাপ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ee;--sf:#fff;--tx:#14213d;--mt:#5b6478;--nv:#0f2347;--gd:#c9a227;--gdt:#14213d;--ln:#e2dccb;--ok:#1f7a4d;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1428;--sf:#142142;--tx:#eef0f6;--mt:#a3adc4;--nv:#050b1a;--gd:#e0b93a;--gdt:#0b1428;--ln:#27365c;--ok:#59c98d}}
:root[data-theme="dark"]{--bg:#0b1428;--sf:#142142;--tx:#eef0f6;--mt:#a3adc4;--nv:#050b1a;--gd:#e0b93a;--gdt:#0b1428;--ln:#27365c;--ok:#59c98d}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#050b1a;color:var(--tx);font:16px/1.5 "Hind Siliguri",system-ui,sans-serif;display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:430px;height:100%;max-height:900px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:500px){#app{height:min(100%,860px);border-radius:28px;border:6px solid #1b305e}}
button,input,select{font:inherit;color:var(--tx)}
input,select{width:100%;min-height:48px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:0 12px}
label{display:block;font-size:14px;color:var(--mt);margin-top:10px}
.btn{background:var(--gd);color:var(--gdt);border:0;border-radius:10px;min-height:46px;padding:0 16px;font-weight:700;cursor:pointer}
.btn.w{width:100%}.btn.o{background:none;border:1px solid var(--gd);color:var(--tx)}.btn.s{min-height:40px;padding:0 12px}
:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.bar{background:var(--nv);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none}
.bar b{color:var(--gd);font-size:20px;flex:1}.bar select{width:auto;min-height:40px;background:#1b305e;color:#fff;border-color:#34497c}
.bar .lg{width:38px;height:38px;border-radius:9px}.bk{background:none;border:0;color:#fff;font-size:26px;min-width:44px;min-height:44px}
#v{flex:1;overflow-y:auto;padding:14px}
.tabs{display:flex;background:var(--sf);border-top:1px solid var(--ln);flex:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;min-height:58px;font-size:12px;color:var(--mt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.tabs button[aria-current=true]{color:var(--tx);font-weight:700;box-shadow:inset 0 3px 0 var(--gd)}
.tabs svg,.ti svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bd{position:absolute;top:4px;right:calc(50% - 22px);background:var(--gd);color:var(--gdt);border-radius:10px;font-size:11px;min-width:18px;font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0;font-size:16px}.mt{color:var(--mt);font-size:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:12px;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.ti{background:var(--nv);color:var(--gd);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.hero{background:var(--nv);color:#fff;border-radius:14px;padding:14px;margin:10px 0}.hero b{color:var(--gd)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:20px;min-height:40px;padding:0 14px;cursor:pointer}
.chip.on{background:var(--nv);color:#fff;border-color:var(--gd)}
.tag{font-size:12px;border:1px solid var(--ln);border-radius:20px;padding:0 8px;color:var(--mt)}.tag.ok{color:var(--ok);border-color:var(--ok)}
.demo{height:62px;border-radius:8px;background:linear-gradient(135deg,#0f2347,#3a5a9a);color:#fff;font-size:13px;display:flex;align-items:end;padding:6px 8px;margin:6px 0}
.big{font-size:24px;font-weight:700;color:var(--gd)}.bar8{height:8px;border-radius:4px;background:var(--gd)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}td:last-child,th:last-child{text-align:right}
.auth{flex:1;overflow-y:auto;background:var(--bg)}.ah{background:var(--nv);color:#fff;text-align:center;padding:36px 20px 22px}
.ah img{width:92px;height:92px;border-radius:22px}.ah h1{margin:6px 0 0;color:var(--gd);font-size:30px}.ah p{margin:0;color:#d9deea;font-size:14px}
.ab{padding:16px 20px 24px}.splash{flex:1;background:var(--nv);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.splash img{width:140px;height:140px;border-radius:32px}.splash h1{margin:0;color:var(--gd);font-size:36px}
.rf{display:none}.q{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-size:20px;cursor:pointer}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;background:var(--nv);color:#fff;padding:10px 14px;border-radius:10px;border:1px solid var(--gd);max-width:90%;display:none;z-index:9;font-size:14px}
.pn{background:linear-gradient(160deg,#0f2347,#1f3f82);color:#fff;text-align:center;padding:24px 24px 32px;border-radius:0 0 90px 12px;flex:none}
.pn img{width:64px;height:64px;border-radius:16px}.pn h1{margin:6px 0 2px;font-size:28px;color:#fff}.pn p{margin:0 0 14px;color:#d9deea;font-size:14px}
.pn .ob{background:none;border:1.5px solid #fff;color:#fff;border-radius:22px;min-height:44px;padding:0 28px;font-weight:600;cursor:pointer}
.fw{overflow:hidden}.tr{display:flex;width:200%;align-items:flex-start;transition:transform .45s ease}.fm{width:50%;padding:16px 22px 24px;text-align:center}
#au[data-m=signup] .tr{transform:translateX(-50%)}
.so{display:flex;gap:10px;justify-content:center;margin:12px 0 6px}.so button{width:44px;height:44px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}.so svg{stroke:var(--tx);fill:none;stroke-width:1.8}
.fm input,.fm select{margin-top:10px}.fm h2{font-size:24px}
.cta{background:var(--nv);color:#fff;border:1px solid var(--gd);border-radius:10px;min-height:48px;padding:0 40px;font-weight:700;margin-top:16px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.tr{transition:none}}
.lgb{border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.12);color:#fff;border-radius:16px;min-height:36px;padding:0 12px;font-size:13px;cursor:pointer}.pn{position:relative}.pn .lgb{position:absolute;top:12px;right:14px}
@media (min-width:640px){
#app.wide{max-width:960px;height:min(100%,600px)}
#au{position:relative;overflow:hidden}
.pn .lgb{right:auto;left:50%;transform:translateX(-50%);top:14px}
.pn img{width:100px;height:100px;border-radius:24px}
.pn{position:absolute;top:0;bottom:0;left:0;width:44%;border-radius:0 120px 120px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:left .5s ease,border-radius .5s ease}
#au[data-m=login] .pn{left:56%;border-radius:120px 0 0 120px}
.fw{position:absolute;top:0;bottom:0;right:0;width:56%;overflow-y:auto;display:flex;align-items:center;transition:right .5s ease}
#au[data-m=login] .fw{right:44%}
.tr,#au[data-m=signup] .tr,#au[data-m=login] .tr{display:grid;width:100%;transform:none}
.fm{width:auto;grid-area:1/1;transition:opacity .4s}
#au[data-m=login] #fs,#au[data-m=signup] #fl{opacity:0;pointer-events:none}
}
@media (min-width:640px) and (max-height:480px){.pn img{width:44px;height:44px}.pn h1{font-size:22px;margin:4px 0}.pn p{font-size:12px;margin-bottom:8px}.fm{padding:10px 22px}.fm h2{font-size:20px}.so{margin:6px 0 2px}.fm input,.fm select{margin-top:6px;min-height:42px}.cta{margin-top:10px}}
@media (orientation:landscape) and (max-height:500px){#app:not(.wide){max-width:100%;max-height:none;height:100%;border:0;border-radius:0}}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bt{flex:1;line-height:1.15;min-width:0}.bt b{display:block;flex:none}.bt small{display:block;color:var(--gd);font-size:11px}.splash small{color:var(--gd);font-size:15px}
</style></head><body><div id="app"></div><div id="toast" role="status"></div>

function calc(){const a=+$("sq").value||0,f=+$("fl").value||1;if(a<1)return;const R=[["ভিত্তি ও মাটির কাজ",8],["ইট, বালু, সিমেন্ট",20],["রড",16],["টাইলস ও ফ্লোর",9],["ইলেকট্রিক ওয়্যারিং",6],["প্লাম্বিং ও পাইপ",5],["দরজা, জানালা, গ্রিল",8],["রাজমিস্ত্রী ও মজুরি",18],["রং ও ফিনিশিং",5],["ডিজাইন ও অনুমোদন",3],["অন্যান্য",2]],k=1+(f-1)*.02,lo=a*2200*k,hi=a*3200*k;

function addAd(){if(!$("ad").value||!$("ap").value)return toast("বিবরণ ও দাম দিন");ADS.unshift([$("at").value,$("ak").value,$("ad").value,+$("ap").value,AREAS[S.L][0]]);S.adf="সব";render();toast("বিজ্ঞাপন প্রকাশিত হয়েছে")}
function stone(i){const t=+$("st"+i).value||0;toast(L(STN[i][0]+": "+T(t)+" টন, মোট "+B(t*STN[i][3]),STN[i][0]+": "+T(t)+" tons, total "+B(t*STN[i][3])))}

/* backend */
async function hash(p,pw){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("rs:"+p+":"+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"x"+pw}}
async function findUser(p){if(DB){try{const d=await DB.collection("accounts").doc(p).get();if(d.exists)return d.data()}catch(e){}}return USERS.find(x=>x.p==p)}
async function doLogin(){if(API)return apiLogin();const p=en($("lp").value).trim(),u=await findUser(p);
if(S.otp){if(!u)return toast("এই নম্বরে অ্যাকাউন্ট নেই");if(en($("lo").value)!="1234")return toast("OTP ভুল (ডেমো কোড ১২৩৪)");return enter(u)}
const h=await hash(p,$("lw").value);if(!u||(u.pwh?u.pwh!==h:u.pw!==$("lw").value))return toast("নম্বর বা পাসওয়ার্ড ভুল");enter(u)}
async function doSignup(){if(API)return apiSignup();const n=$("sn").value.trim(),p=en($("sp").value).trim(),pw=$("sw").value;
if(!n)return toast("নাম দিন");if(!valid(p))return toast("সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন");if(pw.length<6)return toast("পাসওয়ার্ড কমপক্ষে ৬ অক্ষর");if(await findUser(p))return toast("এই নম্বরে অ্যাকাউন্ট আছে");
const u={p,pwh:await hash(p,pw),n,r:S.role};if(S.role==ROLES[1])u.shop=$("s1").value;if(S.role==ROLES[2]){u.job=$("s3").value;u.wage=+en($("s4").value)||0}
if(DB){try{await DB.collection("accounts").doc(p).set(u)}catch(e){USERS.push(u);save()}}else{USERS.push(u);save()}enter(u)}
function mkOrder(r,s,p){if(API)return apiOrder(r,s,p);const o={id:"#"+T(1001+S.orders.length),r,s,p,st:"অপেক্ষমাণ",by:S.user.p,t:Date.now()};if(DB)DB.collection("orders").add(o).catch(()=>{S.orders.unshift(o);render()});else{S.orders.unshift(o);render()}}

function hire(n,j){const b={txt:L(n+" ("+j+") – অনুরোধ পাঠানো হয়েছে",n+" ("+j+") – request sent"),by:S.user.p,t:Date.now()};if(DB)DB.collection("books").add(b).catch(()=>{S.books.unshift(b)});else S.books.unshift(b);toast(L(n+" কে হায়ার অনুরোধ পাঠানো হয়েছে","Hire request sent to "+n))}

function startSync(){const w=(n,k)=>{try{DB.collection(n).onSnapshot(s=>{S[k]=s.docs.map(d=>({...d.data(),_id:d.id})).sort((a,b)=>(b.t||0)-(a.t||0));if(S.scr=="app")render()},()=>{})}catch(e){}};w("orders","orders");w("books","books");w("ads","adsDb");if(S.scr=="app")render()}

const BNR=/[\u0980-\u09FF]/;
function tx(s){if(LANG!="en"||!BNR.test(s))return s;const t=s.trim();if(DX[t]!==undefined)return s.replace(t,DX[t]);for(const[k,v]of DP)if(s.includes(k))s=s.split(k).join(v);return s.replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/।/g,".")}
function trn(n){if(n.nodeType==3){const v=tx(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}if(n.nodeType!=1)return;const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let t;while(t=w.nextNode()){const v=tx(t.nodeValue);if(v!==t.nodeValue)t.nodeValue=v}[n,...n.querySelectorAll("[placeholder],[aria-label],[alt]")].forEach(e=>["placeholder","aria-label","alt"].forEach(a=>{const o=e.getAttribute&&e.getAttribute(a);if(o){const v=tx(o);if(v!==o)e.setAttribute(a,v)}}))}
new MutationObserver(ms=>{if(LANG!="en")return;ms.forEach(m=>{m.addedNodes.forEach(trn);if(m.type=="characterData"){const v=tx(m.target.nodeValue);if(v!==m.target.nodeValue)m.target.nodeValue=v}})}).observe(document.body,{childList:true,subtree:true,characterData:true});
function setLang(){LANG=LANG=="en"?"bn":"en";try{localStorage.setItem("rs_l",LANG)}catch(e){}document.documentElement.lang=LANG;render()}
document.documentElement.lang=LANG;
render();setTimeout(()=>{if(S.scr=="splash"){try{S.scr=localStorage.getItem("rs_seen")?"login":"signup"}catch(e){S.scr="signup"}render()}},1500);
